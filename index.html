<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>EisenhowerBox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;
  --text:#f8fafc;--text2:#94a3b8;--text3:#64748b;
  --q1:#ef4444;--q1bg:#fef2f2;--q1border:#fca5a5;--q1text:#b91c1c;
  --q2:#3b82f6;--q2bg:#eff6ff;--q2border:#93c5fd;--q2text:#1d4ed8;
  --q3:#f59e0b;--q3bg:#fffbeb;--q3border:#fcd34d;--q3text:#b45309;
  --q4:#64748b;--q4bg:#f8fafc;--q4border:#cbd5e1;--q4text:#475569;
  --accent:#6366f1;--accent2:#8b5cf6;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none}

/* Header */
.header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--surface);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-left{display:flex;align-items:center;gap:8px;min-width:0}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .2s;color:var(--text2)}
.btn-icon:hover{background:var(--surface)}
.btn-lang{padding:6px 10px;border-radius:10px;font-size:11px;font-weight:700;color:var(--text2);background:var(--surface);transition:background .2s;display:flex;align-items:center;gap:4px}
.btn-lang:hover{background:var(--surface2)}

/* Matrix grid */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.q-card{border-radius:16px;padding:16px;text-align:left;border:1px solid;transition:transform .15s;position:relative;overflow:hidden}
.q-card:active{transform:scale(.97)}
.q-card .q-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:#fff;font-size:20px}
.q-card .q-name{font-size:15px;font-weight:700}
.q-card .q-desc{font-size:11px;color:#64748b;margin-top:2px;line-height:1.3}
.q-card .q-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.q-badge{padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
.q1-card{background:var(--q1bg);border-color:var(--q1border)}.q1-card .q-name{color:var(--q1text)}.q1-card .q-icon,.q1-card .q-badge{background:var(--q1)}
.q2-card{background:var(--q2bg);border-color:var(--q2border)}.q2-card .q-name{color:var(--q2text)}.q2-card .q-icon,.q2-card .q-badge{background:var(--q2)}
.q3-card{background:var(--q3bg);border-color:var(--q3border)}.q3-card .q-name{color:var(--q3text)}.q3-card .q-icon,.q3-card .q-badge{background:var(--q3)}
.q4-card{background:var(--q4bg);border-color:var(--q4border)}.q4-card .q-name{color:var(--q4text)}.q4-card .q-icon,.q4-card .q-badge{background:var(--q4)}

/* Total */
.total{text-align:center;font-size:12px;color:var(--text3);padding:4px 0 80px}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(99,102,241,.35);z-index:20;transition:transform .15s;font-size:28px}
.fab:active{transform:scale(.9)}

/* List */
.list{padding:12px;display:flex;flex-direction:column;gap:8px;padding-bottom:100px}
.item-card{padding:14px;border-radius:16px;background:rgba(30,41,59,.8);border:1px solid var(--surface);text-align:left;transition:border .2s;display:flex;align-items:start;justify-content:space-between;gap:8px}
.item-card:hover{border-color:var(--border)}
.item-title{font-size:14px;font-weight:600;color:var(--text)}
.item-notes{font-size:12px;color:var(--text3);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-meta{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--text3)}
.item-meta span{display:flex;align-items:center;gap:3px}

/* Empty */
.empty{text-align:center;padding:64px 20px;color:var(--text3)}
.empty .empty-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;opacity:.4;font-size:28px;color:#fff}

/* Detail */
.detail{padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
.detail-card{padding:16px;border-radius:16px;border:1px solid}
.detail-card .d-badge{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.detail-card .d-badge .dot{width:8px;height:8px;border-radius:50%}
.detail-card h2{font-size:18px;font-weight:700;color:#1e293b}
.detail-card .d-notes{font-size:14px;color:#475569;margin-top:8px;white-space:pre-wrap;line-height:1.6}
.meta-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 12px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:4px}
.tag-date{background:var(--surface);color:var(--text2)}
.tag-reminder{background:rgba(99,102,241,.1);color:var(--accent)}

/* Attachments grid */
.att-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.att-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.att-item{border-radius:12px;overflow:hidden;border:1px solid var(--surface);background:var(--surface)}
.att-item img{width:100%;height:120px;object-fit:cover;display:block}
.att-audio{height:80px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.1));color:var(--accent);cursor:pointer;font-size:13px;font-weight:500}
.att-doc{height:80px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text2);font-size:12px}
.att-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:rgba(15,23,42,.4);font-size:11px;color:var(--text3)}
.att-bar button{padding:4px;border-radius:6px;color:var(--text3);display:flex}
.att-bar button:hover{background:var(--surface2)}
.att-bar .del-att{color:var(--q1)}

/* Buttons */
.btn-action{width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.25)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--q1)}
.btn-secondary{background:var(--surface);color:var(--text2)}
.btn-cal{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.15);color:var(--accent)}

/* Form */
.form{padding:16px;display:flex;flex-direction:column;gap:20px;padding-bottom:40px}
.form label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.q-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-opt{padding:12px;border-radius:12px;border:2px solid var(--border);background:rgba(30,41,59,.5);text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s;font-size:13px;font-weight:600;color:var(--text2)}
.q-opt.sel-1{border-color:var(--q1border);background:var(--q1bg);color:var(--q1text)}
.q-opt.sel-2{border-color:var(--q2border);background:var(--q2bg);color:var(--q2text)}
.q-opt.sel-3{border-color:var(--q3border);background:var(--q3bg);color:var(--q3text)}
.q-opt.sel-4{border-color:var(--q4border);background:var(--q4bg);color:var(--q4text)}
.att-buttons{display:flex;gap:8px}
.att-btn{flex:1;padding:12px 8px;border-radius:12px;border:1px solid;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500;transition:background .2s}
.att-btn-img{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2);color:#10b981}
.att-btn-doc{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.2);color:#3b82f6}
.att-btn-mic{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.2);color:#8b5cf6}
.att-btn-mic.recording{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--q1);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* Import modal */
.import-modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.import-sheet{width:100%;max-width:400px;background:var(--surface);border-radius:20px;padding:24px;border:1px solid var(--border);max-height:92vh;overflow-y:auto}
.import-sheet h2{font-size:16px;font-weight:700;margin-bottom:4px}
.import-sheet p{font-size:12px;color:var(--text3);margin-bottom:16px;line-height:1.5}
.import-drop{border:2px dashed var(--border);border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.import-drop:hover,.import-drop.dragover{border-color:var(--accent);background:rgba(99,102,241,.06)}
.import-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.import-drop svg{display:block;margin:0 auto 10px;opacity:.5}
.import-drop span{font-size:13px;color:var(--text3)}
.import-drop strong{color:var(--accent)}
.import-actions{display:flex;gap:8px;margin-top:16px}
.import-actions button{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600}
.import-cancel{background:var(--surface2);color:var(--text2)}
.import-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;color:var(--text);font-family:monospace;line-height:1.5;outline:none;resize:vertical;min-height:120px}
.import-textarea:focus{border-color:var(--accent)}
.import-divider{text-align:center;font-size:12px;color:var(--text3);margin:12px 0;display:flex;align-items:center;gap:8px}
.import-divider::before,.import-divider::after{content:'';flex:1;height:1px;background:var(--surface2)}

/* Search overlay */
.search-overlay{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);padding:16px}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;padding-left:36px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search-results{display:flex;flex-direction:column;gap:8px}
.sr-item{padding:12px;border-radius:12px;background:rgba(30,41,59,.6);border:1px solid rgba(51,65,85,.5);text-align:left;transition:border .2s}
.sr-item:hover{border-color:var(--border)}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{width:100%;max-width:400px;background:var(--surface);border-radius:16px;padding:24px;border:1px solid var(--border)}
.modal p{text-align:center;font-weight:600;margin-bottom:16px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:14px;border-radius:12px;font-weight:600;font-size:14px}
.modal-cancel{background:var(--surface2);color:var(--text2)}
.modal-confirm{background:var(--q1);color:#fff}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;animation:fadeUp .3s ease;white-space:nowrap}
.toast-ok{background:#10b981;color:#fff}
.toast-err{background:var(--q1);color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Responsive */
@media(min-width:500px){.matrix,.att-grid{max-width:440px;margin:0 auto}.list,.detail,.form,.search-overlay{max-width:500px;margin:0 auto}}
</style>
</head>

// ============ FILE HELPERS ============
function compressImg(file){
  return new Promise(r=>{
    const fr=new FileReader();
    fr.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const ratio=Math.min(800/img.width,1);c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};img.src=e.target.result};
    fr.readAsDataURL(file)})
}
function fileToB64(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}
function downloadAtt(att){const a=document.createElement('a');a.href=att.data;a.download=att.name;document.body.appendChild(a);a.click();document.body.removeChild(a)}

// ============ CALENDAR EXPORT ============
function exportICS(item){
  if(!item.reminder)return;
  const d=new Date(item.reminder);
  const pad=n=>String(n).padStart(2,'0');
  const icsDate=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const end=new Date(d.getTime()+3600000);
  const icsEnd=`${end.getFullYear()}${pad(end.getMonth()+1)}${pad(end.getDate())}T${pad(end.getHours())}${pad(end.getMinutes())}00`;
  const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${icsDate}\nDTEND:${icsEnd}\nSUMMARY:${item.title}\nDESCRIPTION:${(item.notes||'').replace(/\n/g,'\\n')}\nBEGIN:VALARM\nTRIGGER:-PT15M\nACTION:DISPLAY\nDESCRIPTION:Reminder\nEND:VALARM\nEND:VEVENT\nEND:VCALENDAR`;
  const blob=new Blob([ics],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${item.title.replace(/[^a-zA-Z0-9]/g,'_')}.ics`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast(state.lang==='fr'?'Fichier .ics téléchargé !':'ICS file downloaded!');
}

// ============ JSON IMPORT ============
function readJSONFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{resolve(JSON.parse(e.target.result))}
      catch(err){reject(err)}
    };
    reader.onerror=()=>reject(new Error('read error'));
    reader.readAsText(file);
  });
}

function parseImportList(raw){
  return Array.isArray(raw)?raw:Array.isArray(raw.tasks)?raw.tasks:Array.isArray(raw.items)?raw.items:null;
}

async function handleImportFile(file){
  if(!file||!file.name.toLowerCase().endsWith('.json')){
    showToast(t('importErr'),'err');
    return;
  }
  try{
    const raw=await readJSONFile(file);
    const list=parseImportList(raw);
    if(!list){showToast(t('importErr'),'err');return;}
    state.importPending=list;
    state.showImportModal=false;
    state.importText='';
    state.showImport=true;
    render();
  }catch(e){
    showToast(t('importErr'),'err');
  }
}

function handleImportText(text){
  try{
    const raw=JSON.parse(text.trim());
    const list=parseImportList(raw);
    if(!list){showToast(t('importErr'),'err');return;}
    state.importPending=list;
    state.showImportModal=false;
    state.importText='';
    state.showImport=true;
    render();
  }catch(e){
    showToast(t('importErr'),'err');
  }
}

function doImport(){
  const list=state.importPending||[];
  let imported=0,skipped=0;
  list.forEach(item=>{
    const q=parseInt(item.quadrant,10);
    if(!item.title||![1,2,3,4].includes(q)){skipped++;return;}
    state.items.push({
      id:uid(),
      title:String(item.title).trim(),
      notes:item.notes?String(item.notes).trim():'',
      quadrant:q,
      reminder:item.reminder||null,
      attachments:[],
      createdAt:item.createdAt||new Date().toISOString()
    });
    imported++;
  });
  saveItems();
  state.showImport=false;
  state.importPending=null;
  render();
  let msg=`${imported} ${t('importOk')}`;
  if(skipped)msg+=` — ${skipped} ${t('importSkip')}`;
  showToast(msg);
}

// ============ RENDER ============
function render(){
  const app=document.getElementById('app');
  let html='';

  if(state.view==='matrix')html=renderMatrix();
  else if(state.view==='list')html=renderList();
  else if(state.view==='detail')html=renderDetail();
  else if(state.view==='form')html=renderForm();

  if(state.searchOpen)html+=renderSearch();
  if(state.showDel)html+=renderDeleteModal();
  if(state.showImportModal)html+=renderImportInputModal();
  if(state.showImport)html+=renderImportModal();
  if(state.toast)html+=`<div class="toast toast-${state.toast.type}">${state.toast.msg}</div>`;

  app.innerHTML=html;
  bind();
}

        <input id="search-input" type="text" value="${esc(state.searchQ)}" placeholder="${t('search')}" style="padding-left:36px">
      </div>
      <button class="btn-icon" style="background:var(--surface);flex-shrink:0" data-action="closeSearch">${I.x}</button>
    </div>
    ${q?`<p style="font-size:12px;color:var(--text3);padding:0 4px;margin-bottom:8px">${t('results')}: ${res.length}</p>`:''}
    ${q&&!res.length?`<p style="text-align:center;color:var(--text3);padding:40px 0">${t('noResults')}</p>`:''}
    <div class="search-results">${res.map(item=>{
      const dot=`background:var(--${QC[item.quadrant]})`;
      return `<button class="sr-item" data-action="openSearchItem" data-id="${item.id}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="width:8px;height:8px;border-radius:50%;${dot};flex-shrink:0"></span>
          <span style="font-size:14px;font-weight:600;color:var(--text)">${esc(item.title)}</span>
        </div>
        ${item.notes?`<p style="font-size:12px;color:var(--text3);padding-left:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(item.notes)}</p>`:''}
      </button>`}).join('')}</div></div>`;
}

// ============ DELETE MODAL ============
function renderDeleteModal(){
  return `<div class="modal-overlay"><div class="modal">
    <p>${t('confirmDel')}</p>
    <div class="modal-btns">
      <button class="modal-cancel" data-action="cancelDel">${t('no')}</button>
      <button class="modal-confirm" data-action="doDelete">${t('yes')}</button>
    </div></div></div>`;
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ============ EVENTS ============
function bind(){
  // Delegated click
  document.getElementById('app').onclick=function(e){
    const btn=e.target.closest('[data-action]');
    if(!btn)return;
    const action=btn.dataset.action;

    if(action==='openQ'){state.selQ=+btn.dataset.q;state.view='list';render()}
    else if(action==='backMatrix'){state.selQ=null;state.view='matrix';render()}
    else if(action==='openItem'){
      const item=state.items.find(i=>i.id===btn.dataset.id);
      if(item){state.selItem=item;state.view='detail';render()}
    }
    else if(action==='backFromDetail'){state.selItem=null;state.view=state.selQ?'list':'matrix';render()}
    else if(action==='addNew'){resetForm();state.view='form';render()}
    else if(action==='addInQ'){resetForm();state.formQ=state.selQ||1;state.view='form';render()}
    else if(action==='editItem'){
      const item=state.selItem;
      state.formTitle=item.title;state.formNotes=item.notes||'';state.formQ=item.quadrant;
      state.formReminder=item.reminder||'';state.formAtts=[...(item.attachments||[])];state.editId=item.id;
      state.view='form';render();
    }
    else if(action==='backFromForm'){resetForm();state.view=state.selItem?'detail':state.selQ?'list':'matrix';render()}
    else if(action==='setQ'){state.formQ=+btn.dataset.qid;render()}
    else if(action==='toggleRec'){
      if(state.isRec)stopRec();else startRec();
    }
    else if(action==='rmAtt'){state.formAtts=state.formAtts.filter(a=>a.id!==btn.dataset.att);render()}
    else if(action==='saveItem'){doSave()}
    else if(action==='confirmDel'){state.showDel=true;render()}
    else if(action==='cancelDel'){state.showDel=false;render()}
    else if(action==='doDelete'){doDelete()}
    else if(action==='openSearch'){state.searchOpen=true;state.searchQ='';render();setTimeout(()=>{const el=document.getElementById('search-input');if(el)el.focus()},50)}
    else if(action==='closeSearch'){state.searchOpen=false;state.searchQ='';render()}
    else if(action==='openSearchItem'){
      const item=state.items.find(i=>i.id===btn.dataset.id);
      if(item){state.selItem=item;state.searchOpen=false;state.searchQ='';state.view='detail';render()}
    }
    else if(action==='toggleLang'){state.lang=state.lang==='fr'?'en':'fr';saveLang();render()}
    else if(action==='exportCal'){exportICS(state.selItem)}
    else if(action==='dlAtt'||action==='dlFormAtt'){
      const atts=action==='dlAtt'?state.selItem.attachments:state.formAtts;
      const att=atts.find(a=>a.id===btn.dataset.att);if(att)downloadAtt(att);
    }
    else if(action==='dlAll'){state.selItem.attachments.forEach(downloadAtt)}
    else if(action==='playAudio'){
      const atts=state.view==='form'?state.formAtts:state.selItem?.attachments||[];
      const att=atts.find(a=>a.id===btn.dataset.att);
      if(att)toggleAudio(att);
    }
    // Import JSON actions
    else if(action==='openImport'){state.showImportModal=true;state.importText='';render();setTimeout(()=>{const el=document.getElementById('import-text');if(el)el.focus()},50)}
    else if(action==='closeImportInput'){state.showImportModal=false;state.importText='';render()}
    else if(action==='pasteImport'){if(state.importText.trim())handleImportText(state.importText)}
    else if(action==='closeImport'){state.showImport=false;state.importPending=null;render()}
    else if(action==='confirmImport'){doImport()}
  };

  // Input bindings
  const ti=document.getElementById('f-title');
  if(ti)ti.oninput=()=>{state.formTitle=ti.value;const sb=document.querySelector('[data-action="saveItem"]');if(sb)sb.disabled=!ti.value.trim()};
  const ni=document.getElementById('f-notes');
  if(ni)ni.oninput=()=>{state.formNotes=ni.value};
  const ri=document.getElementById('f-reminder');
  if(ri)ri.onchange=()=>{state.formReminder=ri.value};
  const si=document.getElementById('search-input');
  if(si)si.oninput=()=>{state.searchQ=si.value;render();setTimeout(()=>{const el=document.getElementById('search-input');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}},10)};

  // Import textarea binding
  const it=document.getElementById('import-text');
  if(it)it.oninput=()=>{
    state.importText=it.value;
    const pb=document.getElementById('btn-paste-import');
    if(pb)pb.disabled=!it.value.trim();
  };

  // File input in import modal
  const jf=document.getElementById('import-file-modal');
  if(jf)jf.onchange=(e)=>{
    const file=e.target.files?.[0];
    if(file)handleImportFile(file);
    jf.value='';
  };

  // File inputs (attachments)
  const fi=document.getElementById('f-img');
  if(fi)fi.onchange=async(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const data=file.type.startsWith('image/')?await compressImg(file):await fileToB64(file);
    state.formAtts.push({id:uid(),name:file.name,type:file.type,data});fi.value='';render();
  };
  const fd=document.getElementById('f-doc');
  if(fd)fd.onchange=async(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const data=await fileToB64(file);
    state.formAtts.push({id:uid(),name:file.name,type:file.type,data});fd.value='';render();
  };
}

function resetForm(){
  state.formTitle='';state.formNotes='';state.formQ=state.selQ||1;
  state.formReminder='';state.formAtts=[];state.editId=null;state.isRec=false;
}

function doSave(){
  if(!state.formTitle.trim())return;
  const data={title:state.formTitle.trim(),notes:state.formNotes.trim(),quadrant:state.formQ,
    reminder:state.formReminder||null,attachments:state.formAtts};
  if(state.editId){
    state.items=state.items.map(i=>i.id===state.editId?{...i,...data,updatedAt:new Date().toISOString()}:i);
    const updated=state.items.find(i=>i.id===state.editId);
    state.selItem=updated;state.view='detail';
  }else{
    const newItem={id:uid(),...data,createdAt:new Date().toISOString()};
    state.items.push(newItem);state.view=state.selQ?'list':'matrix';
  }
  saveItems();resetForm();render();
}

function doDelete(){
  state.items=state.items.filter(i=>i.id!==state.selItem.id);
  saveItems();state.showDel=false;state.selItem=null;
  state.view=state.selQ?'list':'matrix';render();
}

async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const recorder=new MediaRecorder(stream);
    audioChunks=[];
    recorder.ondataavailable=e=>audioChunks.push(e.data);
    recorder.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=()=>{
        state.formAtts.push({id:uid(),name:`vocal-${new Date().toLocaleTimeString().replace(/:/g,'-')}.webm`,type:'audio/webm',data:reader.result});
        render();
      };reader.readAsDataURL(blob);
    };
    mediaRec=recorder;recorder.start();state.isRec=true;render();
  }catch(e){console.error('Mic error:',e)}
}

function stopRec(){
  if(mediaRec?.state==='recording'){mediaRec.stop();state.isRec=false;render()}
}

function toggleAudio(att){
  if(playingId===att.id){audioEls[att.id]?.pause();playingId=null;render();return}
  if(playingId&&audioEls[playingId])audioEls[playingId].pause();
  if(!audioEls[att.id]){audioEls[att.id]=new Audio(att.data);audioEls[att.id].onended=()=>{playingId=null;render()}}
  audioEls[att.id].play();playingId=att.id;render();
}

// ============ INIT ============
load();
render();
</script>
</body>
